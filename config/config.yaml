notification_data: "simulate_data/output/notifications.csv"
sequence_data: "simulate_data/output/sequences.csv"

linkage_filters:
  max_lag_days: 730 # ~2 years

alignment:
  reference: "resources/HXB2_pol.fasta"

hivtrace:
  threshold: 0.03
  ambiguities: resolve
  minoverlap: 800
  reference: HXB2_pol
  curate: remove
  filter: remove 

autotune:
  threshold: 0.05

sierrapy:
  query: "resources/stanford_query.gql"
  res_cutoff: 5 # Stannford levels are 1-5, 5 is high level resistance.

report:
  cutoff_lower: "2019-01-01" # Defined "new" sequences/notifications
  cutoff_upper: "2019-12-31" # Upper bound of "New" collection period.
