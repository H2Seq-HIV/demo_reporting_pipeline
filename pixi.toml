[workspace]
authors = ["LeoFeatherstone <leofeatherstone@protonmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "Demo H2Seq HIV Pipeline"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
test = "Rscript -e 'testthat::test_dir(\"tests/testthat\")'"
pipeline = "snakemake --configfile config/config.yaml --cores all"
dry = "snakemake --configfile config/config.yaml --cores all --dry-run"

[tasks.version-preview]
cmd = """
    tinysemver \
        --dry-run \
        --verbose \
        --major-verbs 'breaking,break,major' \
        --minor-verbs 'feature,feat,minor,add,new' \
        --patch-verbs 'chore,fix,patch,bug,improve,docs,make' \
        --changelog-file 'CHANGELOG.md'
    """

[tasks.version]
cmd = """
    tinysemver \
        --major-verbs 'breaking,break,major' \
        --minor-verbs 'feature,feat,minor,add,new' \
        --patch-verbs 'chore,fix,patch,bug,improve,docs,make' \
        --changelog-file 'CHANGELOG.md'
    """

[tasks.preview]
cmd = "quarto preview report/dashboard.qmd"
depends-on = ["version"]

[tasks.render]
cmd = "quarto render report/dashboard.qmd"
depends-on = ["version"]

[tasks.render]
cmd = "quarto publish gh-pages report/dashboard.qmd"
depends-on = ["render"]

# Default environment for R-based pipeline
[dependencies]
snakemake = ">=9.15.0,<10"
pre-commit = ">=4.6.2,<5"
seqkit = ">=2.13.0,<3"
cawlign = ">=0.1.16,<0.2"
sierrapy = ">=0.4.3,<0.5"
gql = "<3.5.0"
quarto = ">=1.8.27,<2"
csvtk = ">=0.36.0,<0.37"
r-base = ">=4.5.2,<4.6"
r-ape = ">=5.8_1,<6"
r-tidyverse = ">=2.0.0,<3"
r-janitor = ">=2.2.1,<3"
r-networkd3 = ">=0.4.1,<0.5"
r-diagrammer = ">=1.0.11,<2"
r-pointblank = ">=0.12.4,<0.13"
r-testthat = ">=3.3.1,<4"
r-tidyjson = ">=0.3.3.1,<0.4"
r-patchwork = ">=1.3.2,<2"
r-yaml = ">=2.3.12,<3"
r-quarto = ">=1.5.1,<2"

# Separate feature for hivtrace (Python-only, no R)
[feature.hivtrace.dependencies]
python = "3.10.*"
tn93 = ">=1.0.15,<2"
openssl = "*"
python-hyphy-python = ">=0.1.12,<0.2"

[feature.hivtrace.pypi-dependencies]
hivtrace = ">=0.9.2,<0.10"

# Environments with separate solve groups
[environments]
default = { solve-group = "default" }
hivtrace = { features = ["hivtrace"], solve-group = "hivtrace", no-default-feature = true }

[pypi-dependencies]
tinysemver = ">=3.0.3, <4"
